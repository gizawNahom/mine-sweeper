version: 2
updates:
  # Test tooling (Jest, Babel). The engine itself has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor/patch bumps; majors still get their own PR.
      test-tooling:
        update-types: [minor, patch]
    ignore:
      # babel-jest only supports Babel 7; Babel 8 breaks the test run.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  # The React demo (React, Vite, Vitest).
  - package-ecosystem: npm
    directory: /demo-react
    schedule:
      interval: weekly
    groups:
      react-demo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
