# Publishes the sample UIs to GitHub Pages: the plain demo (demo/) with the
# engine source it imports (src/), and the React demo
# (demo-react/, built with Vite) under react/.
# Requires Settings → Pages → Source: "GitHub Actions".

name: Deploy demo

on:
  push:
    branches: [ main ]
    paths:
      - demo/**
      - demo-react/**
      - src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: demo-react/package-lock.json
    - name: Build the React demo
      working-directory: demo-react
      run: |
        npm ci
        npm run build
    - name: Assemble the site
      run: |
        mkdir -p site
        cp -r demo site/demo
        cp -r src site/src
        cp -r demo-react/dist site/react
        cat > site/index.html <<'EOF'
        <!doctype html>
        <meta charset="utf-8" />
        <meta http-equiv="refresh" content="0; url=demo/" />
        <title>Mine-Sweeper</title>
        <a href="demo/">Play the Mine-Sweeper demo</a>
        EOF
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v4
