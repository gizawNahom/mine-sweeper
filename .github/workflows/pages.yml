# Publishes the sample UI (demo/) and the engine it imports (Mine-Sweeper/src/)
# to GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".

name: Deploy demo

on:
  push:
    branches: [ main ]
    paths:
      - demo/**
      - Mine-Sweeper/src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
    - uses: actions/checkout@v4
    - name: Assemble the site
      run: |
        mkdir -p site/Mine-Sweeper
        cp -r demo site/demo
        cp -r Mine-Sweeper/src site/Mine-Sweeper/src
        cat > site/index.html <<'EOF'
        <!doctype html>
        <meta charset="utf-8" />
        <meta http-equiv="refresh" content="0; url=demo/" />
        <title>Mine-Sweeper</title>
        <a href="demo/">Play the Mine-Sweeper demo</a>
        EOF
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v5
