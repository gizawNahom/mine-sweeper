# Publishes the sample UIs to GitHub Pages. scripts/build-site.sh builds the site:
# it mirrors the repository (demos/plain/ imports the engine from ../../src/),
# builds demos/react/ with Vite, and redirects older addresses (/, /demo/, /react/).
# Requires Settings → Pages → Source: "GitHub Actions".

name: Deploy demo

on:
  push:
    branches: [ main ]
    paths:
      - demos/**
      - src/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demos/plain/
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: demos/react/package-lock.json
    - name: Build the site
      run: scripts/build-site.sh
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site
    - id: deployment
      uses: actions/deploy-pages@v5
