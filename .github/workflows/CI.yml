# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - run: npm ci
    - run: npm run coverage
    - run: npm run test:types

  react-demo:
    defaults:
      run:
        working-directory: demos/react
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: demos/react/package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: |
          demos/react/package-lock.json
          e2e/package-lock.json
    - name: Build the site
      run: scripts/build-site.sh
    - name: Install the browser tests and their Chromium
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Run the browser tests
      working-directory: e2e
      run: npm test
    - name: Keep the traces of failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-traces
        path: e2e/test-results
        retention-days: 7
